    <style>
        /* --- LAYOUT UTAMA --- */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #124170 0%, #26667F 100%);
            box-shadow: 0 4px 15px rgba(18, 65, 112, 0.3);
            z-index: 2000;
            padding: 10px 20px;
        }

        .navbar-brand {
            font-weight: 700;
            color: #ffffff !important;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 600;
            padding: 8px 16px !important;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .nav-link.active {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.25);
            font-weight: 700;
        }

        .navbar-toggler {
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 5px;
            color: #ffffff;
        }

        /* Map */
        #map {
            width: 100%;
            height: calc(100vh - 66px);
            z-index: 1;
            background: #DDF4E7;
        }

        /* --- MARKER PIN STYLE --- */
        .marker-pin {
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            background: #124170;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -16px 0 0 -16px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .marker-pin::after {
            content: '';
            width: 24px;
            height: 24px;
            margin: 4px 0 0 4px;
            background: #fff;
            position: absolute;
            border-radius: 50%;
        }

        .marker-icon {
            transform: rotate(45deg);
            color: #124170;
            font-size: 14px;
            z-index: 10;
            position: relative;
            top: -2px;
            left: 1px;
        }

        /* Controls */
        .btn-menu-layer {
            position: absolute;
            top: 80px;
            left: 20px;
            z-index: 1000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: none;
            color: #1B211A;
            box-shadow: 0 4px 12px rgba(18, 65, 112, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.4s;
        }

        .btn-menu-layer.active {
            transform: rotate(180deg);
            background: #26667F;
            color: white;
        }

        .custom-map-controls {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-btn {
            width: 40px;
            height: 40px;
            background-color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(18, 65, 112, 0.15);
            color: #1B211A;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .map-btn:hover {
            background-color: #124170;
            color: #fff;
        }

        /* Panel Katalog */
        .katalog-panel {
            position: absolute;
            top: 80px;
            left: 80px;
            width: 320px;
            max-height: calc(100vh - 100px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(27, 33, 26, 0.15);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transform: translateX(-450px);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.3s ease;
        }

        .katalog-panel.show {
            transform: translateX(0);
            opacity: 1;
        }

        .katalog-header {
            background: #124170;
            color: white;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .katalog-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        /* Search Box */
        .search-wrapper {
            position: relative;
            margin-bottom: 5px;
            z-index: 10;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 30px;
            border: 2px solid #DDF4E7;
            background: #fff;
            outline: none;
            transition: all 0.3s;

            color: #1B211A;
        }

        .search-input:focus {

            background: #fff;

        }

        .search-icon {

            transform: translateY(-50%);

        }

        #search-results {

            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(27, 33, 26, 0.1);
            border: 1px solid #DDF4E7;
            display: none;

        .result-sub {

        .layer-group-title {

            text-transform: uppercase;

            padding: 10px;

            border-radius: 8px;
            cursor: pointer;

        }

        .form-check-input {

        }

        .custom-popup .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
        }

        .popup-header {

        }

        .popup-body {

        .popup-row {

    <script>
        // 1. Inisialisasi Peta
        var map = L.map('map', { zoomControl: false, maxZoom: 28, minZoom: 12 }).setView([-7.46, 109.45], 13);

        // SETUP PANES (Urutan Tumpukan Layer - Agar Point Selalu di Atas)
        map.createPane('pane_admin'); map.getPane('pane_admin').style.zIndex = 400; // Paling Bawah (Polygon)
        map.createPane('pane_infra'); map.getPane('pane_infra').style.zIndex = 450; // Tengah (Jalan)
        map.createPane('pane_facility'); map.getPane('pane_facility').style.zIndex = 600; // Paling Atas (Point)

        var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { opacity: 1.0, attribution: 'OSM' });
        var googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { opacity: 1.0, attribution: 'Google' });
        var googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { opacity: 1.0, attribution: 'Google' });

        map.addLayer(osm);

        map.on('mousemove', function (e) { document.getElementById('coordinates').innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lng: ${e.latlng.lng.toFixed(5)}`; });

        function switchBaseMap(type) {
            map.removeLayer(osm); map.removeLayer(googleHybrid); map.removeLayer(googleStreets);
            if (type === 'osm') { map.addLayer(osm); document.getElementById('radio_osm').checked = true; }
            else if (type === 'streets') { map.addLayer(googleStreets); document.getElementById('radio_streets').checked = true; }
            else { map.addLayer(googleHybrid); document.getElementById('radio_hybrid').checked = true; }
        }

        // 2. Helpers (Icon & Popup)
        function createIcon(icon, color) {
            return L.divIcon({ className: 'custom-div-icon', html: `<div class='marker-pin' style='background:${color} !important'><div class='marker-icon'><i class='${icon}'></i></div></div>`, iconSize: [32, 42], iconAnchor: [16, 42] });
        }
        function createPopup(title, icon, fields) {
            return function (feature) {
                var p = feature.properties; var rows = '';
                for (var k in fields) { if (p[fields[k]]) rows += `<div class="popup-row"><span>${k}</span>: <b>${p[fields[k]]}</b></div>`; }
                return `<div class="popup-header"><i class="${icon}"></i> ${title}</div><div class="popup-body">${rows}</div>`;
            }
        }
        function getDesaColor(nama) {
            var n = (nama || "").toLowerCase();
            if (n.includes("purwareja")) return "#ffadad";
            if (n.includes("kalilandak")) return "#ffd6a5";
            if (n.includes("klampok")) return "#fdffb6";
            if (n.includes("sirkandi")) return "#caffbf";
            if (n.includes("pagak")) return "#9bf6ff";
            if (n.includes("kalimandi")) return "#a0c4ff";
            if (n.includes("kaliwinasuh")) return "#bdb2ff";
            if (n.includes("kecitran")) return "#ffc6ff";
            return "#e7c6ff";
        }

        // 3. Highlight & Zoom
        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({ weight: 3, color: '#DDF4E7', dashArray: '', fillOpacity: 0.5 });
        }
        function resetHighlight(e) {
            var layer = e.target;
            // Kembalikan style default
            if (layer.feature.geometry.type.includes('Polygon')) {
                layer.setStyle({ color: '#666', weight: 2, fillColor: getDesaColor(layer.feature.properties['Nama'] || ""), fillOpacity: 0.3 });
            } else {
                layer.setStyle({ color: '#1B211A', weight: 3 });
            }
        }
        function zoomToFeature(e) {
            var layer = e.target;
            if (layer.getBounds) { map.fitBounds(layer.getBounds()); }
            else { map.flyTo(layer.getLatLng(), 19); }
        }

        // 4. Safe Layer Loading with INTELLIGENT SEARCH
        var allSearchData = [];
        var managedLayers = [];

        function loadLayer(dataVar, type, title, icon, color, fields, visible, minZoom, labelField, targetDivId) {
            if (typeof dataVar === 'undefined' || !dataVar) { console.warn("Missing: " + title); return { layer: null }; }

            var layerPane = 'pane_admin';
            if (type === 'line') layerPane = 'pane_infra';
            if (type === 'point') layerPane = 'pane_facility';

            var layer;
            var styleFunc = function (f) {
                if (type === 'line') return { color: color || '#1B211A', weight: 3 };
                if (type === 'poly') {
                    if (title.includes("Desa") || title.includes("Kecamatan")) {
                        return { color: '#666', weight: 2, fillColor: getDesaColor(f.properties['Nama'] || ""), fillOpacity: 0.3 };
                    }
                    return { color: color || '#124170', weight: 2, fillOpacity: 0.1 };
                }
            };

            var options = {
                pane: layerPane,
                style: styleFunc,
                onEachFeature: function (f, l) {
                    var content = createPopup(title, icon, fields)(f);
                    l.bindPopup(content, { className: 'custom-popup' });

                    if (type !== 'point') {
                        l.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: zoomToFeature });
                    } else {
                        l.on('click', zoomToFeature);
                    }

                    if (labelField && f.properties[labelField]) {
                        l.bindTooltip(String(f.properties[labelField]), { permanent: true, direction: "center", className: "map-label" }).closeTooltip();
                    }

                    // --- SEARCH INDEXING (FITUR BARU) ---
                    var p = f.properties;
                    var searchStr = "";

                    // Loop semua property agar bisa dicari (Nama, Pemilik, Jenis, dll)
                    for (var key in p) {
                        if (p[key]) searchStr += String(p[key]).toLowerCase() + " ";
                    }
                    searchStr += title.toLowerCase();

                    // Penentuan Label Prioritas
                    var label = p.Nama || p.NAMA || p.name || p.Dusun || p['Nama Jalan'] || p['nama jln'] || p.Pemilik || title;

                    allSearchData.push({
                        label: label,
                        sub: title,
                        layer: l,
                        icon: icon || 'fas fa-map-marker-alt',
                        coords: (type === 'point') ? l.getLatLng() : l.getBounds().getCenter(),
                        type: type,
                        bounds: (type !== 'point') ? l.getBounds() : null,
                        searchStr: searchStr
                    });
                }
            };
            var options = {
                pane: layerPane, // Memastikan urutan tumpukan benar
                style: styleFunc,
                onEachFeature: function (f, l) {
                    var content = createPopup(title, icon, fields)(f);
                    l.bindPopup(content, { className: 'custom-popup' });

                    if (type !== 'point') {
                        l.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: zoomToFeature });
                    } else {
                        l.on('click', zoomToFeature);
                    }

                    if (labelField && f.properties[labelField]) {
                        l.bindTooltip(String(f.properties[labelField]), { permanent: true, direction: "center", className: "map-label" }).closeTooltip();
                    }

                    var label = f.properties.Nama || f.properties.name || title;
                    allSearchData.push({ label: label, sub: title, layer: l, icon: icon || 'fas fa-map-marker-alt', coords: l.getLatLng ? l.getLatLng() : l.getBounds().getCenter(), searchStr: (label + " " + title).toLowerCase() });
                }
            };

            if (type === 'point') {
                options.pointToLayer = function (f, latlng) { return L.marker(latlng, { icon: createIcon(icon, color || '#124170') }); };
                delete options.style;
            }

            layer = L.geoJson(dataVar, options);
            var layerObj = { layer: layer, minZoom: minZoom || 0, userEnabled: visible, id: title.replace(/\s/g, '') };
            managedLayers.push(layerObj);

            addCatalogItem(layerObj.id, title, icon, targetDivId, layerObj, visible);

            if (visible) layer.addTo(map);
            return layerObj;
        }

        function addCatalogItem(id, label, icon, divId, objLayer, checked) {
            var div = document.createElement('div'); div.className = 'layer-item';
            div.innerHTML = `<div class="d-flex align-items-center gap-2" onclick="document.getElementById('${id}').click()"><i class="${icon}" style="color:#26667F"></i> <small>${label}</small></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="${id}" ${checked ? 'checked' : ''}></div>`;
            var container = document.getElementById(divId);
            if (container) container.appendChild(div);
            document.getElementById(id).addEventListener('change', function () { objLayer.userEnabled = this.checked; updateVisibility(); });
        }

        // --- 5. PEMANGGILAN LAYER (SEMUA DATA SUDAH BENAR) ---

        // --- A. ADMINISTRASI (Zoom 0+) ---
        var objKecamatan = loadLayer(json_KecamatanPurwarejaKlampok_1, 'poly', 'Batas Kecamatan', 'fas fa-map', '#124170', { 'Nama': 'Nama' }, true, 0, 'Nama', 'cat-admin');

        // Batas Desa
        loadLayer(json_DesaPurwareja_2, 'poly', 'Desa Purwareja', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');
        loadLayer(json_DesaKalilandak_4, 'poly', 'Desa Kalilandak', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');
        loadLayer(json_DesaKlampok_6, 'poly', 'Desa Klampok', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');
        loadLayer(json_DesaSirkandi_8, 'poly', 'Desa Sirkandi', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');
        loadLayer(json_DesaPagak_10, 'poly', 'Desa Pagak', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');
        loadLayer(json_DesaKalimandi_12, 'poly', 'Desa Kalimandi', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');
        loadLayer(json_DesaKaliwinasuh_28, 'poly', 'Desa Kaliwinasuh', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');
        loadLayer(json_batasdesakecitran_14, 'poly', 'Desa Kecitran', 'fas fa-map-pin', '#333', { 'Nama': 'Nama' }, true, 13, 'Nama', 'cat-admin');

        // --- B. FASILITAS UMUM (Point Penting - Muncul di Zoom 13/14) ---
        // Balai Desa
        loadLayer(json_BalaiDesaPurwareja_3, 'point', 'Balai Desa Purwareja', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_BalaiDesaKlampok_7, 'point', 'Balai Desa Klampok', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_BalaiDesaKalilandak_5, 'point', 'Balai Desa Kalilandak', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_BalaiDesaSirkandi_9, 'point', 'Balai Desa Sirkandi', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_BalaiDesaPagak_11, 'point', 'Balai Desa Pagak', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_BalaiDesaKalimandi_13, 'point', 'Balai Desa Kalimandi', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_BalaiDesaKecitran_27, 'point', 'Balai Desa Kecitran', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_BalaiDesaKaliwinasuh_41, 'point', 'Balai Desa Kaliwinasuh', 'fas fa-building', '#3b82f6', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');

        // Point Lain (Sekolah, SPBU, dll)
        loadLayer(json_Sekolah_37, 'point', 'Sekolah', 'fas fa-graduation-cap', '#f59e0b', { 'Nama': 'Nama' }, true, 14, null, 'cat-facility');
        loadLayer(json_SPBU_36, 'point', 'SPBU', 'fas fa-gas-pump', '#ef4444', { 'Nama': 'Nama' }, true, 13, null, 'cat-facility');
        loadLayer(json_FasilitasKeagamaan_42, 'point', 'Tempat Ibadah', 'fas fa-mosque', '#10b981', { 'Nama': 'Nama' }, true, 14, null, 'cat-facility');
        loadLayer(json_TempatMakan_35, 'point', 'Tempat Makan', 'fas fa-utensils', '#f97316', { 'Nama': 'Nama' }, true, 14, null, 'cat-facility');
        loadLayer(json_Toko_34, 'point', 'Toko', 'fas fa-store', '#ec4899', { 'Nama': 'Nama' }, true, 14, null, 'cat-facility');
        loadLayer(json_Lapangan_40, 'point', 'Lapangan', 'fas fa-futbol', '#22c55e', { 'Nama': 'Nama' }, true, 14, null, 'cat-facility');
        loadLayer(json_Pemakaman_39, 'point', 'Pemakaman', 'fas fa-cross', '#64748b', { 'Nama': 'Nama' }, true, 14, null, 'cat-facility');
        loadLayer(json_point_26, 'point', 'Lokasi Penting', 'fas fa-map-marker-alt', '#d946ef', { 'Nama': 'Nama' }, true, 14, null, 'cat-facility');

        // --- C. INFRASTRUKTUR (Jalan) ---
        loadLayer(json_JalanKecamatan_23, 'line', 'Jalan Utama', 'fas fa-road', '#FF9E17', { 'Nama': 'Nama' }, true, 13, null, 'cat-infra');
        loadLayer(json_JalanDesajalan_24, 'line', 'Jalan Desa', 'fas fa-road', '#E77148', {}, true, 14, null, 'cat-infra');
        loadLayer(json_Jalan_33, 'line', 'Jalan Lokal', 'fas fa-road', '#BECF50', {}, false, 15, null, 'cat-infra');
        loadLayer(json_jldesakecitran_22, 'line', 'Jalan Kecitran', 'fas fa-road', '#666', {}, false, 15, null, 'cat-infra');

        loadLayer(json_Sawah_30, 'poly', 'Area Sawah', 'fas fa-seedling', '#22c55e', {}, false, 14, null, 'cat-infra');
        loadLayer(json_Irigasi_32, 'line', 'Saluran Irigasi', 'fas fa-water', '#0dcaf0', {}, false, 14, null, 'cat-infra');

        // --- D. BANGUNAN & RUMAH (Zoom 16+) ---
        loadLayer(json_RumahSaya_38, 'point', 'Rumah Warga', 'fas fa-user', '#d946ef', { 'Nama': 'Nama' }, true, 16, null, 'cat-other');
        loadLayer(json_PosisiRumahSaya_25, 'point', 'Posisi Rumah Saya', 'fas fa-user', '#d946ef', { 'Nama': 'Nama' }, true, 16, null, 'cat-other');
        loadLayer(json_Bangunan_18, 'poly', 'Bangunan', 'fas fa-home', '#777', { 'Nama': 'name' }, false, 17, null, 'cat-other');
        loadLayer(json_Rumah_31, 'poly', 'Rumah', 'fas fa-home', '#777', { 'Nama': 'name' }, false, 17, null, 'cat-other');

        // --- 6. AUTO ZOOM ---
        setTimeout(function () {
            if (objKecamatan && objKecamatan.layer) {
                map.fitBounds(objKecamatan.layer.getBounds());
            }
        }, 500);

        // 7. Update Visibility & Label Control
        function updateVisibility() {
            var z = map.getZoom();
            managedLayers.forEach(i => {
                if (!i.layer) return;
                var shouldShow = i.userEnabled && (z >= i.minZoom);

                if (shouldShow) {
                    if (!map.hasLayer(i.layer)) map.addLayer(i.layer);

                    // Label Control
                    if (i.layer.eachLayer) {
                        // Kecamatan label MATI
                        if (i.id.includes('Kecamatan')) {
                            i.layer.eachLayer(l => l.closeTooltip());
                        }
                        // Desa label HIDUP di zoom 13-14
                        else if (i.id.includes('Desa') || i.id.includes('batas')) {
                            if (z >= 13 && z < 15) i.layer.eachLayer(l => l.openTooltip());
                            else i.layer.eachLayer(l => l.closeTooltip());
                        }
                    }
                } else {
                    if (map.hasLayer(i.layer)) map.removeLayer(i.layer);
                }
            });
        }
        map.on('zoomend', updateVisibility);
        updateVisibility();



        // 8. Search & Menu
        var searchInput = document.getElementById('searchInput'); var resultsBox = document.getElementById('search-results');
        searchInput.addEventListener('input', function (e) {
            var term = e.target.value.toLowerCase(); resultsBox.innerHTML = '';
            if (term.length < 1) { resultsBox.style.display = 'none'; return; }
            var matches = allSearchData.filter(item => item.searchStr.includes(term)).slice(0, 10);
            resultsBox.style.display = 'block';
            if (matches.length > 0) {
                matches.forEach(item => {
                    var div = document.createElement('div'); div.className = 'result-item';
                    div.innerHTML = `<div class="result-icon-box"><i class="${item.icon}"></i></div><div class="result-info"><span class="result-title">${item.label}</span><span class="result-sub">${item.sub}</span></div>`;
                    div.onclick = function () {
                        map.flyTo(item.coords, 18);
                        if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                        setTimeout(() => { item.layer.openPopup(); }, 800);
                        resultsBox.style.display = 'none'; searchInput.value = item.label;
                    }; resultsBox.appendChild(div);
                });
            } else { resultsBox.innerHTML = '<div style="padding:15px; text-align:center; color:#888; font-size:13px;">Data tidak ditemukan.</div>'; }
        });
        document.addEventListener('click', function (e) { if (!document.querySelector('.search-wrapper').contains(e.target)) resultsBox.style.display = 'none'; });
        function toggleMenu() {
            var panel = document.getElementById('katalogPanel'); var btn = document.getElementById('menuBtn'); var icon = btn.querySelector('i');
            panel.classList.toggle('show'); btn.classList.toggle('active');
            icon.className = btn.classList.contains('active') ? 'fas fa-times' : 'fas fa-bars';
        }
        function resetView() { if (objKecamatan && objKecamatan.layer) map.fitBounds(objKecamatan.layer.getBounds()); }
        function locateUser() {
            document.getElementById('btnLocate').classList.add('locating');
            map.locate({ setView: true, maxZoom: 19, enableHighAccuracy: true });
        }
        const navToggler = document.querySelector('.navbar-toggler');
        const navCollapse = document.getElementById('navbarNav');
        navCollapse.addEventListener('show.bs.collapse', () => navToggler.classList.add('open'));
        navCollapse.addEventListener('hide.bs.collapse', () => navToggler.classList.remove('open'));

    </script>
