    <style>
        /* --- LAYOUT UTAMA --- */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

/* Styling Dropdown Menu */
.dropdown-menu {
    border: none;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    padding: 8px 0;
    margin-top: 10px;
    /* Animasi muncul halus */
    animation: fadeIn 0.3s ease;
}

/* Item di dalam dropdown */
.dropdown-item {
    padding: 10px 20px;
    font-weight: 500;
    color: #124170; /* Warna biru tua */
    transition: all 0.2s;
}

/* Efek Hover */
.dropdown-item:hover {
    background-color: #124170; /* Background biru saat hover */
    color: #ffffff; /* Teks putih saat hover */
    transform: translateX(5px); /* Geser sedikit ke kanan */
}

/* Keyframes untuk animasi */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

        /* --- NAVBAR STYLING --- */
        .navbar {
            background: linear-gradient(135deg, #124170 0%, #26667F 100%);
            box-shadow: 0 4px 15px rgba(18, 65, 112, 0.3);
            z-index: 1001;
            padding: 10px 20px;
        }

        .navbar-brand {
            font-weight: 700;
            color: #ffffff !important;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.02);
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 600;
            padding: 8px 16px !important;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .nav-link.active {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.25);
            font-weight: 700;
        }

        .nav-link:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.35);
        }

        .navbar-toggler {
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 5px;
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler.open {
            transform: rotate(90deg);
            background-color: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 991px) {
            .navbar-collapse {
                background: white;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                padding: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
                border-top: 1px solid #f0f0f0;
                border-radius: 0 0 15px 15px;
            }

            .navbar-collapse .nav-link {
                color: #124170 !important;
                margin: 8px 0;
                text-align: center;
                opacity: 0;
                transform: translateY(-20px);
                transition: opacity 0.4s ease, transform 0.4s ease, background-color 0.2s;
            }

            .navbar-collapse .nav-link:hover {
                background-color: #DDF4E7;
                color: #124170 !important;
            }

            .navbar-collapse .nav-link.active {
                background-color: #124170;
                color: #fff !important;
            }

            .navbar-collapse.show .nav-link {
                opacity: 1;
                transform: translateY(0);
            }

            .navbar-collapse.show .nav-item:nth-child(1) .nav-link {
                transition-delay: 0.1s;
            }

            .navbar-collapse.show .nav-item:nth-child(2) .nav-link {
                transition-delay: 0.2s;
            }

            .navbar-collapse.show .nav-item:nth-child(3) .nav-link {
                transition-delay: 0.3s;
            }

            #map {
                height: calc(100vh - 60px);
            }
        }

        /* Map Container */
        #map {
            width: 100%;
            height: calc(100vh - 66px);
            z-index: 1;
            background: #DDF4E7;
        }

        /* Controls */
        .btn-menu-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: none;
            color: #1B211A;
            box-shadow: 0 4px 12px rgba(18, 65, 112, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.4s;
        }

        .btn-menu-layer:hover {
            background: #124170;
            color: white;
            transform: scale(1.1);
        }

        .btn-menu-layer.active {
            transform: rotate(180deg);
            background: #26667F;
            color: white;
        }

        .custom-map-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-btn {
            width: 40px;
            height: 40px;
            background-color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(18, 65, 112, 0.15);
            color: #1B211A;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .map-btn:hover {
            background-color: #124170;
            color: #fff;
            transform: translateY(-2px);
        }

        .map-btn.locating {
            animation: pulse 1.5s infinite;
            color: #26667F;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Panel Katalog */
        .katalog-panel {
            position: absolute;
            top: 20px;
            left: 80px;
            width: 300px;
            max-height: calc(100vh - 100px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(27, 33, 26, 0.15);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transform: translateX(-450px);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.3s ease;
        }

        .katalog-panel.show {
            transform: translateX(0);
            opacity: 1;
        }

        .katalog-header {
            background: #124170;
            color: white;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .katalog-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        /* --- CSS SEARCH BOX (DIPERBAIKI) --- */
        .search-wrapper {
            position: relative;
            margin-bottom: 5px;
            z-index: 10;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 30px;
            border: 2px solid #DDF4E7;
            background: #fff;
            outline: none;
            transition: all 0.3s;

            box-shadow: 0 0 0 4px rgba(38, 102, 127, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #26667F;
        }

        #search-results {
            position: absolute;
            top: 55px;
            left: 0;

            overflow-y: auto;

            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(27, 33, 26, 0.1);
            border: 1px solid #DDF4E7;
            display: none;
            z-index: 2000;
        }

            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            transition: 0.1s;
            color: #1B211A;
        }

        .result-item:hover {

            color: #124170;
            border-left: 4px solid #124170;

        .result-icon-box {

            height: 30px;

            border-radius: 50%;

            align-items: center;
            justify-content: center;

            font-size: 14px;

        }

            align-items: center;
            justify-content: center;
            position: relative;
        }

        .compass-arrow {
            position: absolute;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 20px solid #DC0E0E;
            transform: translateY(-8px);
        }

        .compass-arrow-s {
            position: absolute;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 20px solid #26667F;
            transform: translateY(8px);
        }

        .compass-label {
            position: absolute;
            font-size: 9px;
            font-weight: 800;
            color: #1B211A;
        }

        .label-n {
            top: 2px;
            color: #DC0E0E;
        }

        .label-s {
            bottom: 2px;
            color: #26667F;
        }

        .label-e {
            right: 4px;
        }

        .label-w {
            left: 4px;
        }


        @media (max-width: 576px) {
            .katalog-panel {
                top: 75px;
                left: 10px;
                width: calc(100% - 20px);
                transform: translateX(-120%);
            }

            .btn-menu-layer,
            .custom-map-controls {
                top: 20px;
            }

            .coords-box {
                display: none;
            }
        }

        /* Map Labels & Markers */
        .map-label {
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 11px;
            font-weight: 800;
            color: #1B211A;
            text-align: center;
            white-space: nowrap;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 2px 2px 3px rgba(0, 0, 0, 0.5);
        }

        .leaflet-tooltip-pane {
            pointer-events: none;
        }

        .marker-pin {
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            background: #124170;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -16px 0 0 -16px;
            border: 2px solid white;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .marker-pin::after {
            content: '';
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            margin-left: 3px;
            margin-top: 3px;
            position: absolute;
        }

        .marker-icon {
            transform: rotate(45deg);
            color: #124170;
            font-size: 14px;
            z-index: 10;
            position: relative;
            top: -2px;
            left: 1px;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
        }

        .popup-header {
            background: #124170;
            color: white;
            padding: 12px 15px;
            font-weight: bold;
        }

        .popup-body {
            padding: 15px;
            background: #f8f9fa;
            max-height: 250px;
            overflow-y: auto;
        }

        .popup-row {
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #26667F;
        }
    </style>
</head>

    <script>
        // 1. Inisialisasi Peta
        var map = L.map('map', { zoomControl: false, maxZoom: 28, minZoom: 13 }).setView([-7.47707, 109.44366], 14);

        var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { opacity: 1.0, attribution: 'OSM' });
        var googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { opacity: 1.0, attribution: 'Google' });
        var googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { opacity: 1.0, attribution: 'Google' });
        var googleTerrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', { opacity: 1.0, attribution: 'Google' });

        map.addLayer(osm);

        map.on('mousemove', function (e) { document.getElementById('coordinates').innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lng: ${e.latlng.lng.toFixed(5)}`; });

        function switchBaseMap(type) {
            map.removeLayer(osm); map.removeLayer(googleHybrid); map.removeLayer(googleStreets); map.removeLayer(googleTerrain);
            if (type === 'osm') { map.addLayer(osm); document.getElementById('radio_osm').checked = true; }
            else if (type === 'streets') { map.addLayer(googleStreets); document.getElementById('radio_streets').checked = true; }
            else if (type === 'hybrid') { map.addLayer(googleHybrid); document.getElementById('radio_hybrid').checked = true; }
            else if (type === 'terrain') { map.addLayer(googleTerrain); document.getElementById('radio_terrain').checked = true; }
        }

        // 2. Helpers
        function createIcon(icon, color) {
            return L.divIcon({ className: 'custom-div-icon', html: `<div class='marker-pin' style='background:${color} !important'><div class='marker-icon'><i class='${icon}'></i></div></div>`, iconSize: [30, 42], iconAnchor: [15, 42] });
        }
        function createPopup(title, icon, fields) {
            return function (feature) {
                var p = feature.properties; var rows = '';
                for (var k in fields) { if (p[fields[k]]) rows += `<div class="popup-row"><span>${k}</span>: <b>${p[fields[k]]}</b></div>`; }
                return `<div class="popup-header"><i class="${icon}"></i> ${title}</div><div class="popup-body">${rows}</div>`;
            }
        }
        function getDusunColor(nama) {
            var n = (nama || "").toLowerCase();
            if (n.includes("legok")) return "#ffadad";
            if (n.includes("kecitran")) return "#ffd6a5";
            if (n.includes("bilungan")) return "#fdffb6";
            return "#a0c4ff";
        }

        // 3. Highlight & Zoom
        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({ weight: 3, color: '#DDF4E7', dashArray: '', fillOpacity: 0.3 });
            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                if (layer.feature.geometry.type !== 'Polygon' && layer.feature.geometry.type !== 'MultiPolygon') {
                    layer.bringToFront();
                }
            }
        }
        function resetHighlight(e) {
            var layer = e.target;
            var defaultStyle = { color: '#1B211A', weight: 3, fillOpacity: 0.1 };
            if (layer.feature.properties['Nama'] && (layer.feature.properties['Nama'].includes("Legok") || layer.feature.properties['Nama'].includes("Kecitran") || layer.feature.properties['Nama'].includes("Bilungan"))) {
                defaultStyle = { color: '#666', weight: 1, fillColor: getDusunColor(layer.feature.properties['Nama']), fillOpacity: 0.4 };
            } else if (layer.feature.properties['Nama'] && layer.feature.properties['Nama'].includes("Desa")) {
                defaultStyle = { color: '#124170', weight: 2, fillOpacity: 0.1 };
            }
            layer.setStyle(defaultStyle);
        }
        function zoomToFeature(e) {
            var layer = e.target;
            if (layer.getBounds) { map.fitBounds(layer.getBounds()); }
            else { map.flyTo(layer.getLatLng(), 19); }
        }

        // 4. Safe Layer Loading
        var allSearchData = [];
        var managedLayers = [];

        function loadLayer(varNameAsString, type, title, icon, color, fields, visible, minZoom, labelField) {
            var json = window[varNameAsString];
            if (!json) { console.warn("Layer " + varNameAsString + " tidak ditemukan."); return { layer: null }; }

            var layer;
            var styleFunc = function (f) {
                if (type === 'line') return { color: color || '#1B211A', weight: 3 };
                if (type === 'poly') {
                    var n = f.properties.Nama || "";
                    if (title.includes("Dusun") || n.includes("Legok") || n.includes("Kecitran") || n.includes("Bilungan")) {
                        return { color: '#666', weight: 1, fillColor: getDusunColor(n), fillOpacity: 0.4 };
                    }
                    return { color: color || '#124170', weight: 2, fillOpacity: 0.1 };
                }
            };

            var options = {
                style: styleFunc,
                onEachFeature: function (f, l) {
                    var content = createPopup(title, icon, fields)(f);
                    l.bindPopup(content, { className: 'custom-popup' });

                    if (type !== 'point') {
                        l.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: zoomToFeature });
                    } else {
                        l.on('click', zoomToFeature);
                    }

                    if (labelField && f.properties[labelField]) {
                        l.bindTooltip(String(f.properties[labelField]), { permanent: true, direction: "center", className: "map-label" }).closeTooltip();
                    }

                    var label = f.properties.Nama || f.properties.name || title;
                    allSearchData.push({
                        label: label,
                        sub: title,
                        layer: l,
                        icon: icon || 'fas fa-map-marker-alt',
                        coords: l.getLatLng ? l.getLatLng() : l.getBounds().getCenter(),
                        searchStr: (label + " " + title).toLowerCase()
                    });
                }
            };

            if (type === 'point') {
                options.pointToLayer = function (f, latlng) { return L.marker(latlng, { icon: createIcon(icon, color || '#124170') }); };
                delete options.style;
            }

            layer = L.geoJson(json, options);
            var layerObj = { layer: layer, minZoom: minZoom || 0, userEnabled: visible, id: null };
            managedLayers.push(layerObj);

            if (visible) layer.addTo(map);
            return layerObj;
        }

        // --- 5. LOAD DATA ---
        var objDesa = loadLayer('json_batasdesakecitran_1', 'poly', 'Batas Desa Kecitran', 'fas fa-map', '#124170', { 'Nama': 'Nama' }, true, 0, 'Nama');
        var objLegok = loadLayer('json_dusunlegok_2', 'poly', 'Dusun Legok', 'fas fa-map-pin', null, { 'Nama': 'Nama' }, true, 15, 'Nama');
        var objKecitran = loadLayer('json_dusunkecitran_3', 'poly', 'Dusun Kecitran', 'fas fa-map-pin', null, { 'Nama': 'Nama' }, true, 15, 'Nama');
        var objBilungan = loadLayer('json_dusunbilungan_4', 'poly', 'Dusun Bilungan', 'fas fa-map-pin', null, { 'Nama': 'Nama' }, true, 15, 'Nama');
        var objRW = loadLayer('json_BatasRW_5', 'line', 'Batas RW', 'fas fa-vector-square', '#555', {}, false, 16);
        var objRT = loadLayer('json_rt_rw_6', 'line', 'Batas RT', 'fas fa-th', '#777', {}, false, 17);
        var objJalan = loadLayer('json_Jalan_7', 'line', 'Jalan', 'fas fa-road', '#333', {}, true, 16);
        var objBalai = loadLayer('json_BalaiDesaKecitran_8', 'point', 'Balai Desa', 'fas fa-building', '#124170', { 'Nama': 'Nama' }, true, 15);
        var objPoint = loadLayer('json_point_11', 'point', 'Lokasi Penting', 'fas fa-map-marker-alt', '#d946ef', { 'Nama': 'Nama' }, true, 16);

        function addCatalog(id, label, icon, objLayer, checked) {
            if (!objLayer || !objLayer.layer) return;
            objLayer.id = id;
            var div = document.createElement('div'); div.className = 'layer-item';
            div.innerHTML = `<div class="d-flex align-items-center gap-2" onclick="document.getElementById('${id}').click()"><i class="${icon}" style="color:#26667F"></i> <small>${label}</small></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="${id}" ${checked ? 'checked' : ''}></div>`;
            document.getElementById('layer-list-container').appendChild(div);
            document.getElementById(id).addEventListener('change', function () { objLayer.userEnabled = this.checked; updateVisibility(); });
        }

        addCatalog('sw_desa', 'Batas Desa', 'fas fa-vector-square', objDesa, true);
        addCatalog('sw_legok', 'Dusun Legok', 'fas fa-map-pin', objLegok, true);
        addCatalog('sw_kecitran', 'Dusun Kecitran', 'fas fa-map-pin', objKecitran, true);
        addCatalog('sw_bilungan', 'Dusun Bilungan', 'fas fa-map-pin', objBilungan, true);
        addCatalog('sw_rw', 'Batas RW', 'fas fa-th-large', objRW, false);
        addCatalog('sw_rt', 'Batas RT', 'fas fa-th', objRT, false);
        addCatalog('sw_jalan', 'Jalan', 'fas fa-road', objJalan, true);
        addCatalog('sw_balai', 'Balai Desa', 'fas fa-building', objBalai, true);
        addCatalog('sw_point', 'Lokasi Penting', 'fas fa-map-marker-alt', objPoint, true);

        function updateVisibility() {
            var z = map.getZoom();
            managedLayers.forEach(i => {
                if (!i.layer) return;
                if (i.userEnabled && z >= i.minZoom) {
                    if (!map.hasLayer(i.layer)) map.addLayer(i.layer);

                    if (['sw_legok', 'sw_kecitran', 'sw_bilungan'].includes(i.id)) {
                        if (z >= 14) i.layer.eachLayer(l => l.openTooltip());
                        else i.layer.eachLayer(l => l.closeTooltip());
                    }
                    else if (i.id === 'sw_desa') {
                        if (z < 15) i.layer.eachLayer(l => l.openTooltip());
                        else i.layer.eachLayer(l => l.closeTooltip());
                    }
                } else {
                    if (map.hasLayer(i.layer)) map.removeLayer(i.layer);
                }
            });
        }
        map.on('zoomend', updateVisibility);
        updateVisibility();

        var searchInput = document.getElementById('searchInput'); var resultsBox = document.getElementById('search-results');
        searchInput.addEventListener('input', function (e) {
            var term = e.target.value.toLowerCase(); resultsBox.innerHTML = '';
            if (term.length < 1) { resultsBox.style.display = 'none'; return; }
            var matches = allSearchData.filter(item => item.searchStr.includes(term)).slice(0, 10);
            resultsBox.style.display = 'block';
            if (matches.length > 0) {
                matches.forEach(item => {
                    var div = document.createElement('div'); div.className = 'result-item';
                    div.innerHTML = `<div class="result-icon-box"><i class="${item.icon}"></i></div><div class="result-info"><span class="result-title">${item.label}</span><span class="result-sub">${item.sub}</span></div>`;
                    div.onclick = function () {
                        map.flyTo(item.coords, 18);
                        if (!map.hasLayer(item.layer)) map.addLayer(item.layer);
                        setTimeout(() => { item.layer.openPopup(); }, 800);
                        resultsBox.style.display = 'none'; searchInput.value = item.label;
                    }; resultsBox.appendChild(div);
                });
            } else { resultsBox.innerHTML = '<div style="padding:15px; text-align:center; color:#888; font-size:13px;">Data tidak ditemukan.</div>'; }
        });
        document.addEventListener('click', function (e) { if (!document.querySelector('.search-wrapper').contains(e.target)) resultsBox.style.display = 'none'; });

        function toggleMenu() {
            var panel = document.getElementById('katalogPanel'); var btn = document.getElementById('menuBtn'); var icon = btn.querySelector('i');
            panel.classList.toggle('show'); btn.classList.toggle('active');
            icon.className = btn.classList.contains('active') ? 'fas fa-times' : 'fas fa-bars';
        }
        function resetView() { if (objDesa && objDesa.layer) map.fitBounds(objDesa.layer.getBounds()); }
        function locateUser() {
            document.getElementById('btnLocate').classList.add('locating');
            map.locate({ setView: true, maxZoom: 19, enableHighAccuracy: true });
        }

        const navToggler = document.querySelector('.navbar-toggler');
        const navCollapse = document.getElementById('navbarNav');
        navCollapse.addEventListener('show.bs.collapse', () => navToggler.classList.add('open'));
        navCollapse.addEventListener('hide.bs.collapse', () => navToggler.classList.remove('open'));

    </script>
</body>

</html>
